apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            // Zenith's high-fidelity sim (zenith.json's sim.command) names the auto to run with
            // -Dzenith.auto=<auto>. Gradle does not pass its own -D options into the test JVM, so this
            // does. A named run always runs, even when nothing Gradle tracks has changed, because the auto
            // files it reads are not task inputs and the trace has to come from the file as it is now.
            def zenithAuto = System.getProperty('zenith.auto')
            if (zenithAuto) {
                systemProperty 'zenith.auto', zenithAuto
                outputs.upToDateWhen { false }
            }
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

apply from: "$rootDir/simloop-starter/simloop.gradle"
